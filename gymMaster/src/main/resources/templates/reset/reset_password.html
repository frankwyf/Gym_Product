<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password Template</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./forgot-password.ico"/>
    <meta name="description" content="Free recover password template made with Bootstrap 5">
    <!-- / FontAwesome -->
    <link rel="stylesheet" href="./font-awesome.css">
    <!-- / Bootstrap Core -->
    <link href="./bootstrap.min.css" rel="stylesheet">
    <!-- / Custom style -->
    <link rel="stylesheet" type="text/css" href="./reset_password.css">
</head>
<body>

<main>
    <div class="form-main-container">
        <div class="form-wrapper">
            <div class="form-header">
				<span class="form-title">
					Reset Your Password
				</span>
            </div>

            <form class="form-content" action="/Changepassword" method="post">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="hidden" name="{{ form.hidden_tag() }}">
                        <input type="password" class="form-control form-control-lg" name="password" id="password">
                        <div id="password-error" class="invalid-feedback">Password must contain at least one uppercase letter, one lowercase letter, one digit, and be between 8-16 characters long.</div>
                        <span class="form-control-focus"></span>
                        <div class="input-group-addon" onclick="passwordVisibility();">
                            <i class="fa fa-eye" id="showPass"></i>
                            <i class="fa fa-eye-slash d-none" id="hidePass"></i>
                        </div>
                    </div>
                </div>
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" name="password" id="password">
                        <input type="password" class="form-control form-control-lg" name="confirmpassword" id="confirmpassword">
                        <div id="confirmpassword-error" class="invalid-feedback">Passwords do not match.</div>
                        <span class="form-control-focus"></span>
                    </div>
                </div>
                <input type="submit" class="button-style w-100" name="submit" value="Reset">
                <p class="txt-style1 mt-5">Nothing lost? <input class="txt-style2" d="btnClose" type="button" value="Close this page" onClick="custom_close()" /></p>
            </form>
        </div>
    </div>
</main>
<script src="./reset_password.js"></script>
</body>
</html>

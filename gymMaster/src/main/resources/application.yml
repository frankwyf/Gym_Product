# service port
server:
  #host: 162.14.64.131
  #port: 8087
  port: 8087
  error:
    whitelabel:
      enabled: false
#  ssl:
#      enabled: true
#      key-store: classpath:gymmaster.site.jks
#      key-store-type: JKS
#      key-store-password: CHANGE_ME
#      key-password: CHANGE_ME

# spring boot configuration
spring:
  application:
    # name of application
    name: gym-master-api
    # datasource configuration
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${GYMMASTER_DB_URL:jdbc:mysql://localhost:3306/gymmaster?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${GYMMASTER_DB_USERNAME:root}
      password: ${GYMMASTER_DB_PASSWORD:change-me}
  redis:
    #host: 162.14.64.131
    host: ${GYMMASTER_REDIS_HOST:localhost}
    password: ${GYMMASTER_REDIS_PASSWORD:}
    port: ${GYMMASTER_REDIS_PORT:6379}
    database: 3
  mail:
    host: smtp.qq.com
    # config email port
    port: 465
    # config email
    username: ${GYMMASTER_MAIL_USERNAME:example@example.com}
    # config password
    password: ${GYMMASTER_MAIL_PASSWORD:change-me}
    # 配置默认编码
    default-encoding: UTF-8
    # SSL for email service
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
        # open debug for email service (for log)
        debug: false

  thymeleaf:
    cache: false

  mvc:
    static-path-pattern: /static/**

    servlet:
      multipart:
        max-file-size: 100MB
        max-request-size: 100MB
  web:
    resources:
      static-locations: ${GYMMASTER_STATIC_LOCATIONS:file:src/main/resources/static}

mybatis-plus:
  configuration:
    # when mapping variable name and column name, use underscore to Uppercase camel case
    map-underscore-to-camel-case: true
    # SQL logging: set to org.apache.ibatis.logging.stdout.StdOutImpl for local debug only.
    # In production, remove this line or set to org.apache.ibatis.logging.slf4j.Slf4jImpl.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID

# CORS — set GYMMASTER_CORS_ORIGINS to a comma-separated list of allowed origins.
# Example: http://yourdomain.com,https://yourdomain.com
cors:
  allowed-origins: ${GYMMASTER_CORS_ORIGINS:http://localhost:8080}

# resource configuration
gym:
  path: src/main/resources/static/

# Spring Boot Actuator — expose health and info endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# App info surfaced at /actuator/info
info:
  app:
    name: GymMaster API
    description: Gym management & booking backend
    version: '@project.version@'

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true


# logging configuration
logging:
  config:
    classpath: logback-spring.xml

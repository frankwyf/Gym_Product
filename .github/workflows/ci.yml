name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  mobile-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gym-mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Expo dependency check
        run: npm run check:deps

  miniapp-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JS syntax
        run: |
          find GymMaster_wx -name "*.js" -type f -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Validate JSON files
        run: |
          find GymMaster_wx -name "*.json" -type f -print0 | while IFS= read -r -d '' file; do
            node -e "const fs=require('fs'); JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));" "$file"
          done

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Check i18n key parity
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Run smoke e2e
        run: npm run test:e2e:smoke

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: gym-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Build
        run: npm run build:prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  gymmaster-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -f gymMaster/pom.xml test -e -B
      - name: Package backend
        run: mvn -f gymMaster/pom.xml -DskipTests package -B

  gym-management-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -f gym-management-system-master/pom.xml test -e -B
      - name: Verify backend
        run: mvn -f gym-management-system-master/pom.xml -DskipTests verify -B
      - name: Package backend
        run: mvn -f gym-management-system-master/pom.xml -DskipTests -Dspring-boot.repackage.skip=true package

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: gym-ui/package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run unit tests
        run: npm run test:unit
      - name: Run smoke e2e
        run: npm run test:e2e:smoke

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: gym-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: gym-ui/package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        run: npm run build:prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  gymmaster-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run unit tests
        run: mvn -f gymMaster/pom.xml test

  gym-management-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Package backend
        run: mvn -f gym-management-system-master/pom.xml -DskipTests -Dspring-boot.repackage.skip=true package

name: CD Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Build frontend
        run: npm run build:prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Archive frontend
        run: |
          cd dist
          zip -r ../gym-ui-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gym-ui-dist
          path: gym-ui/gym-ui-dist.zip

  build-gymmaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package gymMaster
        run: mvn -f gymMaster/pom.xml -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: gymMaster-jar
          path: gymMaster/target/*.jar

  build-gym-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package gym-management-system-master
        run: mvn -f gym-management-system-master/pom.xml -DskipTests -Dspring-boot.repackage.skip=true package
      - uses: actions/upload-artifact@v4
        with:
          name: gym-management-package
          path: gym-management-system-master/target/*.jar

  package-mobile-miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive mobile source bundle
        run: |
          cd gym-mobile-app
          zip -r ../gym-mobile-app-source.zip .
      - name: Archive miniapp source bundle
        run: |
          cd GymMaster_wx
          zip -r ../GymMaster_wx-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-miniapp-sources
          path: |
            gym-mobile-app-source.zip
            GymMaster_wx-source.zip

  release:
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-gymmaster
      - build-gym-management
      - package-mobile-miniapp
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.jar" -exec cp {} release-assets/ \;
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
